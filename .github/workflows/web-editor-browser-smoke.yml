name: Main web editor browser startup

on:
  pull_request:
    paths:
      - editor/apps/studio/playwright.web.config.ts
      - editor/apps/studio/e2e-web/**
      - .github/workflows/web-editor-browser-smoke.yml
      - editor/apps/web/**
  push:
    branches: [main]
    paths:
      - editor/apps/web/**
      - editor/apps/studio/e2e-web/**
      - .github/workflows/web-editor-browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: editor
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: editor
        run: pnpm --filter @openreel/studio exec playwright install --with-deps chromium
      - name: Launch main web editor and exercise real startup
        working-directory: editor
        run: pnpm --filter @openreel/studio exec playwright test -c playwright.web.config.ts
        env:
          CI: 'true'
      - name: Retain browser failures for Astra review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-editor-browser-smoke
          path: |
            editor/apps/studio/playwright-report/
            editor/apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 7
